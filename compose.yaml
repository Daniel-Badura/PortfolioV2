services:
  server:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
        VITE_FORMSPREE_FORM_ID: ${VITE_FORMSPREE_FORM_ID:-moevqqvl}
    ports:
      - "3000:5000"
    environment:
      NODE_ENV: production
      DATA_SOURCE: file
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
